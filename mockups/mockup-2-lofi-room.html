<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelStash — Lo-Fi Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-hi:#6d4a5c; --wall:#4a3850; --wall-lo:#33283f;
    --ember:#f3a15a; --peach:#ffd38a; --peach-soft:#ffe6b0;
    --cream:#f7e9cf;
    --wood:#b07b45; --wood-hi:#cd9a5f; --wood-lo:#6f4a29;
    --kraft:#ecdcb6; --kraft-lo:#c8b08a; --kraft-ink:#5a4632;
    image-rendering:pixelated;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Silkscreen',monospace; color:var(--cream); background:#241c2e;
    min-height:100%; display:flex; flex-direction:column; align-items:center; padding:24px 12px 40px;
  }

  .scene{
    position:relative; width:100%; max-width:820px; min-height:660px; overflow:hidden;
    border:5px solid #1d1626; box-shadow:inset 0 0 0 3px #7a5f6e, 0 14px 0 -4px #150f1c;
    background:
      radial-gradient(120% 90% at 82% 6%, rgba(255,211,138,.30), rgba(255,211,138,0) 46%),
      linear-gradient(178deg, var(--wall-hi) 0%, var(--wall) 42%, var(--wall-lo) 100%);
  }
  .floor{position:absolute; left:0; right:0; bottom:0; height:78px;
    background:linear-gradient(#3a2b34,#2b2029); border-top:4px solid #221820; z-index:1;}

  /* Window: light source */
  .window{position:absolute; top:26px; right:34px; width:172px; height:132px; z-index:2;
    background:linear-gradient(180deg,var(--peach) 0%, var(--ember) 58%, #d9695a 100%);
    border:7px solid #5a3b30; box-shadow:0 0 60px 18px rgba(243,161,90,.45), inset 0 0 0 2px #7a5040;}
  .window::before,.window::after{content:""; position:absolute; background:#5a3b30;}
  .window::before{left:50%; top:0; bottom:0; width:6px; transform:translateX(-50%);}  /* vertical bar */
  .window::after{top:50%; left:0; right:0; height:6px; transform:translateY(-50%);}   /* horizontal bar */
  .window .sun{position:absolute; left:50%; bottom:54px; transform:translateX(-50%);
    width:46px; height:46px; background:var(--peach-soft); box-shadow:0 0 34px 16px rgba(255,230,176,.85);}
  .sill{position:absolute; top:150px; right:22px; width:196px; height:12px; z-index:2;
    background:linear-gradient(var(--wood-hi),var(--wood)); border:3px solid var(--wood-lo);}

  /* Signature: sunset beam */
  .beam{position:absolute; top:-60px; right:60px; width:260px; height:820px; z-index:1;
    background:linear-gradient(180deg, rgba(255,222,150,.34), rgba(255,200,130,.10) 40%, rgba(255,200,130,0) 72%);
    transform:rotate(24deg); transform-origin:top center; mix-blend-mode:screen; pointer-events:none;}
  .dust{position:absolute; width:4px; height:4px; background:rgba(255,240,205,.85); z-index:1; pointer-events:none;
    animation:drift 7s steps(6) infinite;}
  @keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-14px,26px);opacity:0}}

  /* HUD hanging tag */
  .hud{position:absolute; top:0; left:42px; z-index:5; text-align:center;}
  .hud__string{width:3px; height:26px; margin:0 auto; background:#7a5f6e;}
  .hud__tag{position:relative; background:var(--kraft); color:var(--kraft-ink);
    border:3px solid var(--kraft-lo); padding:10px 18px 12px; box-shadow:0 5px 0 rgba(0,0,0,.28);}
  .hud__tag::before{content:""; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:8px; height:8px; border-radius:50%; background:#8a7355;}
  .hud__label{font-size:8px; letter-spacing:2px; color:#8a7355; margin-top:6px;}
  .hud__total{font-family:'Press Start 2P'; font-size:18px; margin-top:7px; color:#4a3510; text-shadow:2px 2px 0 rgba(243,161,90,.5);}

  /* Shelves */
  .stack{position:relative; z-index:3; padding:182px 26px 0;}
  .shelf{margin-bottom:36px;}
  .shelf__row{display:grid; grid-template-columns:repeat(6,1fr); align-items:end; gap:2px; padding:0 8px 3px;}
  .shelf__plank{height:16px; background:linear-gradient(var(--wood-hi),var(--wood));
    border:3px solid var(--wood-lo); box-shadow:0 7px 0 -1px var(--wood-lo), 0 12px 22px rgba(0,0,0,.42);}
  .slot{display:flex; justify-content:center; align-items:flex-end; min-height:150px;}
  .jar{width:96px; height:auto; display:block; cursor:pointer; transition:transform .12s steps(2);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));}
  .jar.ghost:hover{transform:translateY(-4px);}

  /* jar + its foot label lift together on hover */
  .jarwrap{position:relative; cursor:pointer; transition:transform .12s steps(2);}
  .jarwrap:hover{transform:translateY(-7px);}
  /* kraft label wrapped around the foot of the jar */
  .jarwrap .label{position:absolute; left:50%; bottom:7%; transform:translateX(-50%);
    background:var(--kraft); border:2px solid var(--kraft-lo); padding:3px 5px 4px; text-align:center;
    width:62px; box-shadow:0 2px 0 rgba(0,0,0,.22); pointer-events:none;}
  .label .n{font-size:10px; font-weight:700; color:var(--kraft-ink); display:block; line-height:1;}
  .label .d{font-size:7px; color:#8a7355; display:block; margin-top:2px;}

  /* Black cat with yellow eyes */
  .cat{position:absolute; bottom:76px; right:44px; z-index:4; width:100px; height:52px;}
  .cat .body{position:absolute; bottom:0; left:16px; width:80px; height:30px; background:#1b1b22; border:3px solid #47434f; border-radius:46% 46% 24% 24%;}
  .cat .tail{position:absolute; bottom:1px; right:-8px; width:30px; height:11px; background:#1b1b22; border:3px solid #47434f; border-radius:0 55% 55% 0; transform:rotate(-6deg);}
  .cat .head{position:absolute; bottom:6px; left:0; width:34px; height:30px; background:#1b1b22; border:3px solid #47434f; border-radius:46%; z-index:2;}
  .cat .ear{position:absolute; top:-5px; width:12px; height:12px; background:#1b1b22; border:3px solid #47434f; z-index:1;}
  .cat .ear.l{left:2px; transform:rotate(-12deg);} .cat .ear.r{left:18px; transform:rotate(12deg);}
  .cat .eye{position:absolute; top:11px; width:8px; height:7px; background:#f5c542; border:1px solid #8a6410; z-index:3;}
  .cat .eye.l{left:5px;} .cat .eye.r{left:19px;}
  .cat .pupil{position:absolute; top:12px; width:2px; height:5px; background:#141414; z-index:4;}
  .cat .pupil.l{left:8px;} .cat .pupil.r{left:22px;}
  .cat .nose{position:absolute; top:19px; left:15px; width:5px; height:3px; background:#5a3b45; z-index:3;}

  /* Add button */
  .add{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:5;}
  .add__btn{font-family:'Silkscreen'; font-weight:700; font-size:12px; color:#4a3510;
    background:linear-gradient(var(--peach),var(--ember)); border:3px solid #b87a34;
    padding:12px 22px; cursor:pointer; letter-spacing:1px; box-shadow:0 5px 0 #935e26;}
  .add__btn:active{transform:translateY(4px); box-shadow:0 1px 0 #935e26;}

  .cap{max-width:820px; margin:22px auto 0; text-align:center; font-size:9px; color:#a998ad; letter-spacing:1px; line-height:1.9;}
  .cap b{color:var(--peach);}
  @media (prefers-reduced-motion: reduce){ .dust{animation:none;} }
  @media (max-width:560px){ .shelf__row{grid-template-columns:repeat(3,1fr);} .cat{display:none;} }
</style>
</head>
<body>

<div class="cap">
  <b>LO-FI ROOM v3</b> · bocaux plus gros, remplis de vraies têtes de weed pixel (5 sprites réutilisés)<br>
  Chat noir aux yeux jaunes · soleil sur le barreau vertical · 12 slots (4 remplis)
</div>

<script>
  // Fill each jar with pixel-art buds: 5 sprites reused randomly, packed up to the fill line.
  (function(){
    var BUDS=['#bud1','#bud2','#bud3','#bud4','#bud5'];
    var SVGNS='http://www.w3.org/2000/svg';
    var cols=[4,9,14,19,24];
    document.querySelectorAll('.jar[data-fill]').forEach(function(svg){
      var top=parseFloat(svg.getAttribute('data-fill'));
      var g=svg.querySelector('.buds');
      var row=0;
      for(var y=44-9; y>top-5; y-=4){
        var off=(row%2)?2.5:0;
        cols.forEach(function(cx){
          var size=9+Math.random()*2;
          var x=cx+off+(Math.random()*2-1);
          var yy=y+(Math.random()*2-1);
          var u=document.createElementNS(SVGNS,'use');
          u.setAttribute('href',BUDS[Math.floor(Math.random()*BUDS.length)]);
          u.setAttribute('x',x.toFixed(1)); u.setAttribute('y',yy.toFixed(1));
          u.setAttribute('width',size.toFixed(1)); u.setAttribute('height',size.toFixed(1));
          g.appendChild(u);
        });
        row++;
      }
    });
  })();
</script>
</body>
</html>
