<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelStash — Maquette 1 : Cozy Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#f7ecd4; --wall2:#f1e2c3;
    --wood:#c99a5f; --wood-d:#a9793f; --wood-dd:#7c5528; --wood-l:#e0bd85;
    --kraft:#e7d6ac; --kraft-d:#c9b385;
    --ink:#5a4632; --ink-soft:#8a7355;
    --sage:#8fb596; --mango:#f2ac5c; --liver:#c98fae; --mwhs:#9ac48f;
    --glass:#dff0ec;
    --btn:#8fb596; --btn-d:#6f9a76;
    image-rendering:pixelated;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Silkscreen',monospace; color:var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,0,0,.02) 38px 40px),
      radial-gradient(circle at 50% 12%, var(--wall) 0%, var(--wall2) 90%);
    min-height:100vh; padding:28px 16px 60px;
    display:flex; flex-direction:column; align-items:center;
  }
  .frame{width:100%; max-width:760px;}

  /* ---------- HUD ---------- */
  .hud{
    display:flex; justify-content:center; margin-bottom:26px;
  }
  .hud__sign{
    position:relative; background:var(--wood); color:#fff8e8;
    padding:16px 30px; text-align:center;
    border:4px solid var(--wood-dd);
    box-shadow:0 6px 0 var(--wood-dd), inset 0 0 0 3px var(--wood-l);
  }
  .hud__sign::before,.hud__sign::after{
    content:""; position:absolute; top:-18px; width:6px; height:16px;
    background:var(--wood-dd);
  }
  .hud__sign::before{left:26px;} .hud__sign::after{right:26px;}
  .hud__label{font-size:10px; letter-spacing:2px; opacity:.85;}
  .hud__total{font-family:'Press Start 2P'; font-size:22px; margin-top:8px; text-shadow:2px 2px 0 var(--wood-dd);}

  /* ---------- Shelf ---------- */
  .shelf{
    position:relative; margin-bottom:34px;
  }
  .shelf__jars{
    display:flex; justify-content:space-around; align-items:flex-end;
    padding:0 26px 6px; gap:8px; flex-wrap:wrap;
  }
  .shelf__plank{
    height:22px; background:linear-gradient(var(--wood-l), var(--wood));
    border:3px solid var(--wood-dd);
    box-shadow:0 8px 0 -1px var(--wood-dd), 0 9px 14px rgba(90,60,30,.25);
  }
  .shelf__bracket{position:absolute; bottom:-8px; width:14px; height:26px; background:var(--wood-d); border:3px solid var(--wood-dd);}
  .shelf__bracket.l{left:12px;} .shelf__bracket.r{right:12px;}

  /* ---------- Jar ---------- */
  .jar{width:96px; cursor:pointer; transition:transform .12s steps(2); position:relative;}
  .jar:hover{transform:translateY(-6px);}
  .jar__lid{
    height:15px; margin:0 12px; background:var(--cap);
    border:3px solid rgba(0,0,0,.28); border-bottom:none;
    box-shadow:inset 0 4px 0 rgba(255,255,255,.35);
  }
  .jar__neck{height:7px; margin:0 16px; background:var(--glass); border:3px solid #b9d4cd; border-top:none; border-bottom:none;}
  .jar__body{
    position:relative; height:104px; background:var(--glass);
    border:3px solid #b9d4cd; overflow:hidden;
  }
  .jar__fill{position:absolute; left:0; right:0; bottom:0; height:var(--fill); background:var(--cap); opacity:.9;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.3);
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 3px, transparent 3px 7px);}
  .jar__shine{position:absolute; top:8px; left:10px; width:9px; height:64px; background:rgba(255,255,255,.55);}
  .jar__label{
    position:absolute; left:6px; right:6px; top:44px; background:var(--kraft);
    border:2px solid var(--kraft-d); padding:6px 2px; text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .jar__name{font-size:11px; font-weight:700; color:var(--ink); display:block; line-height:1.1;}
  .jar__date{font-size:8px; color:var(--ink-soft); margin-top:3px; display:block;}

  /* ---------- Add button ---------- */
  .add{display:flex; justify-content:center;}
  .add__btn{
    font-family:'Silkscreen'; font-weight:700; font-size:12px; color:#264a2c;
    background:var(--btn); border:3px solid var(--btn-d);
    padding:14px 24px; cursor:pointer; letter-spacing:1px;
    box-shadow:0 5px 0 var(--btn-d); transition:transform .1s steps(2), box-shadow .1s steps(2);
  }
  .add__btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--btn-d);}

  .caption{margin-top:34px; text-align:center; font-size:9px; color:var(--ink-soft); letter-spacing:1px; line-height:1.8;}
  .caption b{color:var(--ink);}
</style>
</head>
<body>
  <div class="frame">
    <div class="hud">
      <div class="hud__sign">
        <div class="hud__label">📦 TOTAL STASH</div>
        <div class="hud__total">237g</div>
      </div>
    </div>

    <div class="shelf">
      <div class="shelf__jars">
        <div class="jar" style="--cap:var(--mwhs); --fill:100%;">
          <div class="jar__lid"></div><div class="jar__neck"></div>
          <div class="jar__body"><div class="jar__fill"></div><div class="jar__shine"></div>
            <div class="jar__label"><span class="jar__name">Mwhs</span><span class="jar__date">🌱 13/07</span></div>
          </div>
        </div>
        <div class="jar" style="--cap:var(--mango); --fill:84%;">
          <div class="jar__lid"></div><div class="jar__neck"></div>
          <div class="jar__body"><div class="jar__fill"></div><div class="jar__shine"></div>
            <div class="jar__label"><span class="jar__name">Mango</span><span class="jar__date">🌱 23/07</span></div>
          </div>
        </div>
        <div class="jar" style="--cap:var(--mango); --fill:52%;">
          <div class="jar__lid"></div><div class="jar__neck"></div>
          <div class="jar__body"><div class="jar__fill"></div><div class="jar__shine"></div>
            <div class="jar__label"><span class="jar__name">Mango</span><span class="jar__date">🌱 10/04</span></div>
          </div>
        </div>
        <div class="jar" style="--cap:var(--liver); --fill:71%;">
          <div class="jar__lid"></div><div class="jar__neck"></div>
          <div class="jar__body"><div class="jar__fill"></div><div class="jar__shine"></div>
            <div class="jar__label"><span class="jar__name">Liver</span><span class="jar__date">🌱 10/04</span></div>
          </div>
        </div>
      </div>
      <div class="shelf__plank"></div>
      <div class="shelf__bracket l"></div>
      <div class="shelf__bracket r"></div>
    </div>

    <div class="add">
      <button class="add__btn">+ NOUVEAU BOCAL</button>
    </div>

    <div class="caption">
      MAQUETTE 1 — <b>« COZY SHELF »</b><br>
      Ambiance claire &amp; chaleureuse · étagère bois · HUD panneau suspendu<br>
      Bocaux avec niveau de remplissage proportionnel au poids
    </div>
  </div>
</body>
</html>
