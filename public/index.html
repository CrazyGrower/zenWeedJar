<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PixelStash</title>
<link rel="stylesheet" href="/fonts/fonts.css?v=ee289f44ee">
<link rel="stylesheet" href="/style.css?v=ee289f44ee">
</head>
<body>
<main class="app">
  <canvas id="scene" aria-label="L'étagère et ses bocaux. Touche un bocal pour l'ouvrir."></canvas>
  <div class="labels" id="labels" aria-hidden="true"></div>
  <div class="fallback" id="fallback" hidden></div>

  <header class="hud">
    <div class="hud__title">
      <h1>Mon étagère</h1>
      <p class="hud__last" id="hud-last"></p>
    </div>
    <button class="hud__tag" id="hud-tag" type="button" title="Voir le journal et les stats">
      <span class="hud__total" id="hud-total">…</span>
      <span class="hud__label">en réserve</span>
      <span class="hud__eta" id="hud-eta"></span>
    </button>
  </header>

  <nav class="bottom" aria-label="Actions">
    <div class="seg" role="group" aria-label="Fenêtre">
      <button type="button" data-mode="sunset" aria-pressed="true">Coucher de soleil</button>
      <button type="button" data-mode="night" aria-pressed="false">Nuit</button>
    </div>
    <button class="add__btn" id="add-btn" type="button">+ Nouveau bocal</button>
  </nav>
</main>

<dialog id="detail-dialog"></dialog>
<dialog id="form-dialog"></dialog>
<dialog id="history-dialog"></dialog>

<script src="/vendor/three.min.js?v=ee289f44ee"></script>
<script src="/stash-model.js?v=ee289f44ee"></script>
<script src="/tape-label.js?v=ee289f44ee"></script>
<script src="/scene3d/kit.js?v=ee289f44ee"></script>
<script src="/scene3d/props.js?v=ee289f44ee"></script>
<script src="/scene3d/room.js?v=ee289f44ee"></script>
<script src="/scene3d/jar.js?v=ee289f44ee"></script>
<script src="/scene3d/stage.js?v=ee289f44ee"></script>
<script src="/api.js?v=ee289f44ee"></script>
<script src="/app.js?v=ee289f44ee"></script>
</body>
</html>
